[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "money-machine"
version = "0.1.0"
description = "Auditable, defined-risk autonomous options agent for Alpaca paper trading"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.14,<2",
  "alpaca-mcp-server>=2,<3",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "mcp>=1.12,<2",
  "openai>=1.99,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.1,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
money-machine = "money_machine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
money_machine = ["py.typed", "templates/*.html", "static/*.css", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires Alpaca paper credentials and network access",
  "order_integration: submits a development-account paper order and requires explicit CLI opt-in",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".codex_password_compare.py", ".codex-spreadsheet-work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["money_machine"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mcp.*", "structlog.*"]
ignore_missing_imports = true
