services:
  dashboard:
    build: .
    environment:
      APP_ENV: development
      ACCOUNT_ROLE: development
      RUN_MODE: replay
      DATABASE_URL: postgresql+psycopg://money_machine:local-development-only@postgres:5432/money_machine
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: money_machine
      POSTGRES_USER: money_machine
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_machine"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - money-machine-postgres:/var/lib/postgresql/data

volumes:
  money-machine-postgres:
