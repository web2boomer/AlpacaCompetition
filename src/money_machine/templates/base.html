<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Money Machine — an auditable defined-risk options agent">

    <div class="grain"></div>
    <header class="nav shell">
      <a class="brand" href="/" aria-label="Money Machine home">

        <span>Money Machine</span>

      <div class="nav-meta">

    </footer>
